# Skill 自优化配置。复制为 settings.yaml，配置独立 Policy Model。
# 工作副本、审计记录和报告默认保存在仓库外的 Preparation/runtime。
schema_version: 1

# Executor、Embedding、Skill 和向量缓存由 framework 配置提供；数据由 Group 指定。
# 相对路径以当前 self_optimization/ 目录为基准。
framework_config: ../framework/settings.yaml

workspace:
  # 每次运行会在此目录下新建唯一子目录，并复制 framework/skills 到 <run>/skills。
  # 优化模型只修改这个副本，绝不会把修改写回 framework/skills。
  runs_root: ../../Preparation/runtime/runs
  # null 时自动使用 UTC 时间和随机后缀。显式填写时目录必须不存在，防止覆盖旧实验。
  run_id: null

optimizer:
  # local: 自托管模型；api: 云端模型。也可用 CLI --policy-mode 临时切换。
  # 两种模式独立配置，不会在失败时自动切换到另一模式或模型。
  mode: api
  profiles:
    local:
      provider: openai-compatible
      # 与 llama-server --alias 或 vLLM --served-model-name 一致。
      model: qwen3.5-9b
      base_url: http://127.0.0.1:18081/v1
      api_key: null
      api_key_env: null
      timeout_seconds: 600
      extra_headers: {}
      options:
        default_max_tokens: 8192
        max_retries: 2
        retry_backoff_seconds: 2.0
        extra_body:
          chat_template_kwargs:
            enable_thinking: false
    api:
      provider: openai-compatible
      # 按服务实际开通的模型填写；此 ID 不保证对你的 key 开放。
      # 先核对模型调用权限；失败时不会自动替换型号。
      model: qwen3.5-27b
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: null
      api_key_env: DASHSCOPE_API_KEY
      timeout_seconds: 600
      extra_headers: {}
      options:
        default_max_tokens: 8192
        max_retries: 2
        retry_backoff_seconds: 2.0
        extra_body:
          enable_thinking: false
          stream: true
          stream_options:
            include_usage: true

optimization:
  # 优化需要一定探索性，但过高会降低 JSON 和代码稳定性。
  temperature: 0.1
  # 优化模型单次响应预算；必须足够返回一个文件的完整替换内容。
  max_tokens: 8192
  # 下面四项共同限制发送给优化模型的上下文，避免语料或 Skill 脚本导致 prompt 过大。
  max_prompt_chars: 120000
  max_skill_file_chars: 24000
  max_process_chars: 30000
  max_documents: 10
  document_excerpt_chars: 1200
  # 一轮只能选择一个 Skill，并最多完整替换这里指定数量的文件。
  max_edits: 3
  # 模型返回不存在的路径、无实质变化或非法 JSON 时，携带明确错误反馈自动纠正的总尝试次数。
  # HTTP 失败仍由 optimizer.options.max_retries 处理，两者不是同一层重试。
  max_proposal_attempts: 3
  # false 时只能修改已存在的 SKILL.md、scripts/* 或 references/* 文本文件。
  allow_new_files: false
  # true 时，Qwen 超时、非法 JSON 或结构校验失败会记录为 rejected 并继续下一 Task。
  continue_on_optimization_error: true
  # true 时在当前 Task 中抽样重跑，仅检查代码执行与接口契约。
  # 不比较性能指标或要求答案命中 gold；性能指标仅作为 Policy 的后续反馈。
  # 代码无法执行、接口不合法或修改越界时才拒绝或恢复修改前快照。
  verify_revision_execution: true
