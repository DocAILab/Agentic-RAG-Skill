# One Group, one shared Corpus, one optimization event after each Task.
# All paths below are relative to this configuration file.
schema_version: 2
self_optimization_config: settings.yaml
group_path: ../data/groups/hotpotqa-train-001/group.json
shuffle_seed: 42

workflow:
  # All QA contribute to metrics; only bounded traces go to Policy.
  max_process_examples: 5
  # When verify_revision_execution is enabled, replay participating QA to check
  # execution and interface contracts only. This is not a performance sample;
  # metrics, answer correctness and gold matching do not accept/reject edits.
  validation_examples_per_task: 3
  request:
    top_k: 10
