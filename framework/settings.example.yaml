# Copy to settings.yaml and configure Executor/Embedding services.
# Paths are relative to this file. Generated indexes stay outside the project.
# Task data are selected by the Group workflow; this config has no demo section.
schema_version: 1
skills:
  root: skills
  manage_skill: manage-rag-default
runtime:
  vector_index:
    enabled: true
    cache_dir: ../../Preparation/runtime/vector-indexes
  request_defaults:
    top_k: 10
    max_tokens: 8192
    rank_constant: 60
executor:
  provider: openai-compatible
  model: deepseek-v4.1-flash-1017
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key: null
  api_key_env: DASHSCOPE_API_KEY
  timeout_seconds: 600
  extra_headers: {}
  options:
    max_retries: 2
    retry_backoff_seconds: 2.0
    # HyDE/classifier/critic requests use small output budgets; require final text.
    # DeepSeek enables thinking by default, which can consume the entire budget.
    extra_body:
      enable_thinking: false
embedding:
  enabled: true
  provider: sentence-transformers
  model: BAAI/bge-large-en-v1.5
  base_url: null
  api_key: null
  api_key_env: null
  timeout_seconds: 600
  extra_headers: {}
  options:
    device: null
    batch_size: 8
    normalize_embeddings: true
