# Copy to settings.yaml and configure Executor/Embedding services.
# Paths are relative to this file. Generated indexes stay outside the project.
schema_version: 1
skills:
  root: skills
  manage_skill: manage-rag-default
runtime:
  vector_index:
    enabled: true
    cache_dir: ../../Preparation/runtime/vector-indexes
  request_defaults:
    top_k: 10
    max_tokens: 8192
    rank_constant: 60
executor:
  provider: openai-compatible
  model: deepseek-v4-flash
  base_url: https://api.vveai.com/v1
  api_key: null
  api_key_env: VVEAI_API_KEY
  timeout_seconds: 600
  extra_headers: {}
  options:
    max_retries: 2
    retry_backoff_seconds: 2.0
embedding:
  enabled: true
  provider: sentence-transformers
  model: BAAI/bge-large-en-v1.5
  base_url: null
  api_key: null
  api_key_env: null
  timeout_seconds: 600
  extra_headers: {}
  options:
    device: null
    batch_size: 8
    normalize_embeddings: true
