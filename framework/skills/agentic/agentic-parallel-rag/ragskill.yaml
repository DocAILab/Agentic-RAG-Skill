schema_version: 1
runtime_id: agentic.parallel.multi_branch
kind: agentic
version: 0.1.0
mutable: false
runtime:
  type: python-workflow
  path: scripts/workflow.py
  callable: run
slots:
  rewriter:
    capability: rewriter
    input: RewriteRequest
    output: RewriteResult
    min: 0
    max: 1
  retrievers:
    capability: retriever
    input: RetrievalRequest
    output: RetrievalResult
    min: 2
    max: 4
  reranker:
    capability: reranker
    input: RerankRequest
    output: RerankResult
    min: 0
    max: 1
  generator:
    capability: generator
    input: GenerationRequest
    output: GenerationResult
    min: 1
    max: 1
