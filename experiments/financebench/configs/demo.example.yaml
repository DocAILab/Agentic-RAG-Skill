schema_version: 1

skills:
  root: ../../../framework/skills
  manage_skill: manage-rag-default

runtime:
  request_defaults:
    top_k: 5
    max_tokens: 512
    max_iterations: 3

demo:
  corpus_path: ../data/demo/corpus.jsonl
  test_path: ../data/demo/test.jsonl
  output:
    result_path: ../outputs/demo_results.json
    log_path: ../outputs/demo.log.jsonl
  max_examples: 20
  candidate_documents_only: true
  select_skills_per_example: false
  batch_selection_query_sample_size: 5
  request:
    top_k: 5
    max_tokens: 512
    max_iterations: 3
    constraints:
      agentic_skill: agentic-iterative-rag
      retriever: component-bm25-retriever
      generator: component-grounded-generator
      critic: component-critic
      rewriter: disabled
      reranker: disabled
      purpose: FinanceBench evidence-page controlled demo

executor:
  provider: openai-compatible
  model: deepseek-v4-flash
  base_url: https://api.deepseek.com/v1
  api_key: null
  api_key_env: DEEPSEEK_API_KEY
  timeout_seconds: 180
  extra_headers: {}
  options: {}

embedding:
  enabled: false
  provider: sentence-transformers
  model: BAAI/bge-large-en-v1.5
  base_url: null
  api_key: null
  api_key_env: null
  timeout_seconds: 120
  extra_headers: {}
  options: {}
